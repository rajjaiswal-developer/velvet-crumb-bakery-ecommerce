name: Scheduled Background Jobs (Expired Reservation Sweep & Outbox Retry)

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-cron-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Expired Reservation Sweep
        run: |
          APP_URL="${{ secrets.VERCEL_URL || 'https://velvetcrumbdemo.com' }}"
          if [[ ! "$APP_URL" =~ ^https:// ]]; then
            APP_URL="https://$APP_URL"
          fi
          echo "Triggering expired reservation sweep at $APP_URL/api/cron/release-reservations..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/release-reservations")
          echo "$response"

      - name: Trigger Notification Outbox Retry Processor
        run: |
          APP_URL="${{ secrets.VERCEL_URL || 'https://velvetcrumbdemo.com' }}"
          if [[ ! "$APP_URL" =~ ^https:// ]]; then
            APP_URL="https://$APP_URL"
          fi
          echo "Triggering outbox retry processor at $APP_URL/api/cron/process-outbox..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "$APP_URL/api/cron/process-outbox")
          echo "$response"
